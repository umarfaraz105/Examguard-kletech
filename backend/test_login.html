<!DOCTYPE html>
<html>
<head>
    <title>Test Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        input, button {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 5px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>ExamGuard Login Test</h1>
    
    <form id="loginForm">
        <input type="email" id="email" placeholder="Email" value="admin@examguard.edu" required>
        <input type="password" id="password" placeholder="Password" value="admin123" required>
        <button type="submit">Login</button>
    </form>
    
    <div id="result"></div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.textContent = 'Logging in...';
            resultDiv.className = '';
            
            try {
                const response = await fetch('http://localhost:8000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.textContent = 'SUCCESS!\n\nToken: ' + data.access_token.substring(0, 50) + '...';
                    resultDiv.className = 'success';
                    
                    // Store token
                    localStorage.setItem('access_token', data.access_token);
                    
                    // Test getting current user
                    setTimeout(async () => {
                        try {
                            const userResponse = await fetch('http://localhost:8000/api/auth/me', {
                                headers: {
                                    'Authorization': 'Bearer ' + data.access_token
                                }
                            });
                            const userData = await userResponse.json();
                            resultDiv.textContent += '\n\nUser Data:\n' + JSON.stringify(userData, null, 2);
                        } catch (err) {
                            resultDiv.textContent += '\n\nError fetching user: ' + err.message;
                        }
                    }, 500);
                } else {
                    resultDiv.textContent = 'FAILED!\n\n' + JSON.stringify(data, null, 2);
                    resultDiv.className = 'error';
                }
            } catch (error) {
                resultDiv.textContent = 'ERROR!\n\n' + error.message;
                resultDiv.className = 'error';
            }
        });
    </script>
</body>
</html>
